<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#1A3626"/>
  <g transform="translate(256,256)">
    <!-- Stylized W&R monogram -->
    <text x="0" y="20" text-anchor="middle" dominant-baseline="middle" 
          font-family="serif" font-weight="bold" font-size="280" fill="#E5A93D">W</text>
    <text x="0" y="120" text-anchor="middle" dominant-baseline="middle"
          font-family="serif" font-weight="bold" font-size="140" fill="#D3C4A5">R</text>
  </g>
  <!-- Small paw accent -->
  <circle cx="400" cy="90" r="25" fill="#E5A93D" opacity="0.8"/>
  <circle cx="370" cy="60" r="14" fill="#E5A93D" opacity="0.6"/>
  <circle cx="430" cy="60" r="14" fill="#E5A93D" opacity="0.6"/>
</svg>